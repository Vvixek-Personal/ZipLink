<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipLink — Expiring ZIP File Sharing, Code Editor &amp; context.md Generator</title>
    <meta
      name="description"
      content="Upload a ZIP archive to safely extract it into an unlisted, expiring share page with syntax-highlighted code viewing, owner editing, diff view, and a deterministic context.md."
    />
    <meta property="og:title" content="ZipLink — Expiring ZIP File Sharing, Code Editor &amp; context.md Generator" />
    <meta
      property="og:description"
      content="Upload a ZIP archive to safely extract it into an unlisted, expiring share page with syntax-highlighted code viewing, owner editing, diff view, and a deterministic context.md."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ziplink-theme');
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

</html>
